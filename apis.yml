x-coverage:
  state: none
  reason: no-developer-program
  detail: >-
    Little Spoon runs no developer program at all — no portal, no docs, no signup, no spec: its
    storefront is served by an undocumented first-party JSON backend at api.littlespoon.com that
    answers /v1/products and /v1/labels unauthenticated but 404s every discovery path
    (/openapi.json, /swagger.json, /graphql, /docs, /.well-known/*), so the only machine-readable
    things it publishes are a marketing llms.txt and a React design system on npm.
