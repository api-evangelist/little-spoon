aid: little-spoon
name: Little Spoon
description: >-
  Little Spoon is a New York-based direct-to-consumer children's food and nutrition brand, founded in
  2017, that delivers fresh, organic, stage-based meals, snacks and infant formula for babies, toddlers
  and kids on a subscription basis across the United States. Its product architecture maps to feeding
  stages — Formula, Babyblends purees, Biteables finger foods, Baby Puffs, Baby Cereal, Smoothies and
  YoGos, Lunchers, Plates and a snack line — with a frozen line sold exclusively through Target. The
  brand competes on ingredient transparency: a published No-No List of 100+ banned ingredients, EU-level
  food safety standards, 500+ toxin and contaminant tests, and 2000+ safety tests per batch of Formula.
  Little Spoon operates no public developer program and publishes no API contract; its storefront is a
  Next.js front end backed by an undocumented first-party JSON API at api.littlespoon.com. It does
  publish two machine-readable public artifacts — an llms.txt at the site root and an open-source React
  design system distributed as fifteen @littlespoon/* npm packages from the little-spoon-dev GitHub org.
