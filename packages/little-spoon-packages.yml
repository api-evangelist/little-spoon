provider: Little Spoon
summary: 'Little Spoon publishes fifteen first-party npm packages under the @littlespoon scope. They are
  the Little Spoon Design System — React UI components, an icon set and a theme — not API client libraries.
  Little Spoon publishes no API contract and no API SDK, so these are recorded as Packages/Components
  and deliberately NOT wired as type: SDKs: the sdk_count check reads client libraries for an API, and
  crediting a design system against it would assert a developer program Little Spoon does not run.'
ownership: 'First-party: every package points at git+https://github.com/little-spoon-dev/design-system,
  and the little-spoon-dev GitHub org declares https://www.littlespoon.com/ as its blog/website.'
