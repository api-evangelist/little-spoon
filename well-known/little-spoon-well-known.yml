summary: >-
  Exactly one document is served under /.well-known/ across every Little Spoon host: an
  apple-app-site-association at www.littlespoon.com, which supports Universal Links into the Little
  Spoon iOS app. Every other path 404s — www.littlespoon.com answers with its Next.js 404 HTML page
