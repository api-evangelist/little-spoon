  apple-app-site-association is a mobile deep-link manifest, not an RFC 9727 api-catalog linkset,
  and the well_known_catalog check exists to measure the latter; crediting it here would assert an
  agent discovery entrypoint Little Spoon does not serve. No security.txt, no OAuth metadata, no
  agentic-commerce document (ucp.json / acp.json) is published on any host.
