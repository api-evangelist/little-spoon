provider: Little Spoon
summary: >-
  Little Spoon publishes no API contract, no OAuth surface and no security/compliance program, so
  every cross-cutting API standard below is asserted false with the probe that establishes it. It
  does publish an unusually detailed set of FOOD-SAFETY certifications, which are recorded separately
  under product_certifications. Those are product certifications, not published API or information-
  security compliance, so no type Compliance pointer is emitted from this file — the
  compliance_published check measures SOC 2 / ISO 27001 / HIPAA / GDPR-class posture and crediting
  USDA Organic against it would be a category error.
