summary: >-
  Little Spoon publishes an open-source React design system — the Little Spoon Design System — as a
  Lerna monorepo of fifteen scoped npm packages. These are client-side UI components consumed by the
  littlespoon.com Next.js storefront. They are NOT embeddable third-party surfaces: there is no hosted
  widget, no drop-in checkout element, no embed script and no loader library, so a non-Little-Spoon
  developer can install them but has nothing of Little Spoon's to embed. Recorded here because the
  component library is real, first-party and publicly distributed.
